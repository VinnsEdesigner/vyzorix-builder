name: Release

# Publishes vyzorix-builder for every supported platform as release assets on a
# `v*` tag. A tag is the only trigger: the released binary carries the tag as its
# version, so a binary that reports a version is always a tagged one.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Test
        run: ./scripts/check.sh --no-lint

      - name: Build all platforms
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist

          # The builder has no third-party C++ dependencies, so it cross-builds
          # with only a toolchain. linux/amd64 and linux/arm64 are the platforms
          # the builder itself runs on; the artifacts it produces are arm64.
          for target in linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            cmake -S . -B "build-$arch" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_FLAGS="-DVYZORIX_BUILDER_VERSION=\"$version\"" \
              >/dev/null
            cmake --build "build-$arch" --parallel >/dev/null
            cp "build-$arch/cmd/vyzorix-builder/vyzorix-builder" "dist/vyzorix-builder-$os-$arch"
          done

          cd dist && sha256sum vyzorix-builder-* > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "vyzorix-builder $GITHUB_REF_NAME" \
            --generate-notes \
            dist/vyzorix-builder-* \
            dist/SHA256SUMS
